<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>League of Olympus Chronicle</title><style>html,body,#chronicle{margin:0;width:100%;height:100%;border:0;background:#fffef9}body{overflow:hidden}</style></head><body><iframe id="chronicle" title="League of Olympus Chronicle"></iframe><script>
const outer=document.getElementById('chronicle'),params=new URLSearchParams(location.search);outer.src='./weekly-recap-base.html?'+params.toString()+(location.hash||'');
outer.onload=async()=>{const d=outer.contentDocument;if(!d)return;const week=Number(params.get('week')||1);try{
const st=d.createElement('style');st.textContent=`:root{--chron-gold:#9a6a12;--chron-gold-dark:#6f4808;--chron-ink:#241811}body{background:linear-gradient(90deg,#f5efdf 0,#fffdf7 7%,#fffdf7 93%,#f5efdf 100%)!important;color:var(--chron-ink)}.mast,.hero,.tabs,.section,.chron{position:relative}.mast .ey{display:none!important}.mast h1{font-size:clamp(42px,7vw,70px)!important;line-height:.95!important}.hero{background:linear-gradient(135deg,#fffdf7,#fbf4e5)!important;box-shadow:0 5px 16px #2a180f18}.hero .ey,.section>h2{color:#6f180f!important;text-shadow:0 1px 0 #fff}.hero h2,.mast h1{text-shadow:0 1px 0 #fff,0 2px 3px #2a180f18}.tabs{box-shadow:0 4px 10px #2a180f22}.topScoreboard .score{background:linear-gradient(135deg,#fffdf8,#fff 72%)!important;border:1px solid #d6c8b1!important;box-shadow:0 4px 11px #2a180f24!important}.topScoreboard .row{font-weight:700}.topScoreboard .win{color:var(--chron-gold-dark)!important}.chron{background:linear-gradient(90deg,#fffdf8,#fff 50%,#fffdf8)}.chron p{color:#261b13;line-height:1.68}.chron strong{color:#76500b!important}.chronLead{border-top:1px solid #cdbb9c;border-bottom:1px solid #cdbb9c;padding:26px 22px!important;background:linear-gradient(135deg,#fffaf0,#fffdf8)!important;box-shadow:0 5px 14px #2a180f18}.chronLead h1{color:#6f4808!important}.chronBattleCard{margin:28px 0!important;padding:22px 22px 24px!important;border:1px solid #d7c8ad!important;border-left:7px solid #9a6a12!important;border-radius:4px;background:linear-gradient(135deg,#fffdf8,#fff 72%)!important;box-shadow:0 6px 16px #2a180f28!important}.chronBattleCard h2,.chronBattleCard h3{color:#6f4808!important}.section{border-color:#cbb58b!important}.section>h2{letter-spacing:.1em}#legends .olympus,#legends .section:has(.olympus){display:none!important}#sourceFrame{position:fixed!important;left:-10000px!important;top:-10000px!important;width:1280px!important;height:900px!important;border:0!important;visibility:hidden!important;pointer-events:none!important}.allPlaySnapshot{margin-top:30px}.allPlaySnapshot .snapshotGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.allPlaySnapshot .snapshotRow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid #d7c8ad;border-left:5px solid #9a6a12;padding:11px 13px;font:700 16px/1.3 Arial}.snapshotRank,.snapshotRecord{color:#6f4808;font-weight:900}.canonicalStatus{margin:12px 0;padding:10px 12px;border:1px solid #d7c8ad;background:#fffaf0;font:700 13px Arial;color:#6f4808}@media(max-width:760px){.mast h1{font-size:clamp(38px,11vw,52px)!important}.chronLead{padding:20px 16px!important}.chronBattleCard{margin:20px 0!important;padding:18px 16px 20px!important;border-left-width:5px!important}.chron p{font-size:17px!important;line-height:1.62!important}.allPlaySnapshot .snapshotGrid{grid-template-columns:1fr}}`;d.head.appendChild(st);
const mast=d.querySelector('.mast');if(mast){const h=mast.querySelector('h1'),sub=mast.querySelector('.sub');if(h)h.textContent='The Battle for Olympus';if(sub)sub.textContent=`Chapter I • Week ${week}`}
const hero=d.querySelector('.hero');if(hero){const ey=hero.querySelector('.ey'),h=hero.querySelector('h2'),deck=hero.querySelector('.deck');if(ey)ey.textContent='Chapter I';if(h)h.textContent='The First Battles of Olympus';if(deck)deck.textContent='Where the first territories fell, six legends rose, and the long conquest of Mount Olympus began.'}
const honorTab=d.querySelector('.tab[data-tab="honors"]');if(honorTab)honorTab.textContent='Honors';
const chron=d.querySelector('#chronicle');if(chron&&!d.querySelector('.topScoreboard')){const sec=d.createElement('section');sec.className='section topScoreboard';sec.innerHTML=`<h2>Week ${week} Scoreboard • The Six Battles</h2><div class="scoregrid"></div>`;chron.prepend(sec)}
const source=d.createElement('iframe');source.id='sourceFrame';source.title='Canonical League Data';source.src=`./index.html?chronicleEmbed=1&chronicleWeek=${week}&v=canonical`;d.body.appendChild(source);
for(const src of [`./chronicle-mainboard-ledger.js?v=canonical-20260915-1`,`./chronicle-static-map.js?v=9cf3d45`]){const r=await fetch(src,{cache:'no-store'});if(!r.ok)throw new Error(src+' '+r.status);const s=d.createElement('script');s.textContent=await r.text();d.body.appendChild(s)}
const article=d.querySelector('#chronicle article.chron');if(article){const r=await fetch('./chronicles/week-'+String(week).padStart(2,'0')+'.md',{cache:'no-store'});if(r.ok){const md=await r.text();article.innerHTML='';const rich=(el,text)=>text.split(/(\*\*.*?\*\*)/g).filter(Boolean).forEach(part=>{if(part.startsWith('**')&&part.endsWith('**')){const b=d.createElement('strong');b.textContent=part.slice(2,-2);el.appendChild(b)}else el.appendChild(d.createTextNode(part))});for(const raw of md.replace(/\r/g,'').split('\n')){const line=raw.trim();if(!line)continue;let el;if(line.startsWith('# ')){el=d.createElement('header');el.className='chronLead';const h=d.createElement('h1');rich(h,line.slice(2));el.appendChild(h)}else if(line.startsWith('## ')){el=d.createElement('section');el.className='chronBattleCard';const h=d.createElement('h2');rich(h,line.slice(3));el.appendChild(h)}else if(line.startsWith('### ')){el=d.createElement('h3');rich(el,line.slice(4))}else{el=d.createElement('p');rich(el,line)}article.appendChild(el)}}}
const makeSnapshot=()=>{const body=d.querySelector('#allplay');if(!body||!body.children.length||d.querySelector('.allPlaySnapshot'))return false;const rows=[...body.querySelectorAll('tr')];if(!rows.length)return false;const sec=d.createElement('section');sec.className='section allPlaySnapshot';sec.innerHTML=`<h2>Week ${week} All-Play Snapshot</h2><p class="note">How every army would have fared against the entire Week ${week} field.</p><div class="snapshotGrid"></div>`;const grid=sec.querySelector('.snapshotGrid');rows.forEach((tr,i)=>{const c=[...tr.children].map(x=>x.textContent.trim());if(c.length<4)return;const row=d.createElement('div');row.className='snapshotRow';row.innerHTML='<span class="snapshotRank"></span><span class="snapshotTeam"></span><span class="snapshotRecord"></span>';row.querySelector('.snapshotRank').textContent=c[0]||String(i+1);row.querySelector('.snapshotTeam').textContent=(c[1]||'')+(c[2]?' • '+c[2]:'');row.querySelector('.snapshotRecord').textContent=c[3]||'';grid.appendChild(row)});chron.appendChild(sec);return true};
const ap=d.querySelector('#allplay');if(ap){if(!makeSnapshot()){const mo=new MutationObserver(()=>{if(makeSnapshot())mo.disconnect()});mo.observe(ap,{childList:true,subtree:true})}}
source.addEventListener('load',()=>{d.documentElement.dataset.canonicalSource='main-board'},{once:true});
if(location.hash)d.querySelector('[data-tab="'+location.hash.slice(1)+'"]')?.click();
}catch(e){console.error('Chronicle canonical loader',e);const n=d.createElement('div');n.className='canonicalStatus';n.textContent='The Chronicle could not load the canonical main-board snapshot. Refresh to retry.';d.body.prepend(n)}};
</script></body></html>
