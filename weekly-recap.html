<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>League of Olympus Chronicle</title><style>html,body,#chronicle{margin:0;width:100%;height:100%;border:0;background:#fffef9}body{overflow:hidden}</style></head><body><iframe id="chronicle" title="League of Olympus Chronicle"></iframe><script>const f=document.getElementById('chronicle');const p=new URLSearchParams(location.search);f.src='./weekly-recap-base.html?'+p.toString()+(location.hash||'');f.onload=async()=>{const d=f.contentDocument;if(!d)return;try{const week=Number(p.get('week')||1);const chronMap=d.querySelector('#chronicle .fadeMap');if(chronMap){chronMap.innerHTML=`<img class="cs a" src="./chronicle-snapshots/original.jpg" alt="League map before Week ${week}"><img class="cs b" src="./chronicle-snapshots/week-${String(week).padStart(2,'0')}.jpg" alt="League map after Week ${week}"><div class="stateBadge sb">Before Week ${week}</div>`;}for(const src of ['./chronicle-enhancements.js?v=c02380d','./chronicle-static-map.js?v=89a9feb7']){const r=await fetch(src,{cache:'no-store'});if(!r.ok)throw new Error(src+' '+r.status);const s=d.createElement('script');s.textContent=await r.text();d.body.appendChild(s)}const article=d.querySelector('#chronicle article.chron');if(article){const r=await fetch('./chronicles/week-'+String(week).padStart(2,'0')+'.md',{cache:'no-store'});if(r.ok){const md=await r.text();article.replaceChildren();const rich=(el,text)=>text.split(/(\*\*.*?\*\*)/g).filter(Boolean).forEach(part=>{if(part.startsWith('**')&&part.endsWith('**')){const b=d.createElement('strong');b.textContent=part.slice(2,-2);el.appendChild(b)}else el.appendChild(d.createTextNode(part))});md.replace(/\r/g,'').split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).forEach(block=>{let el;if(block.startsWith('# ')){el=d.createElement('header');el.className='chronLead';const k=d.createElement('div');k.textContent='Chronicles of the Conquest • Week '+week;const h=d.createElement('h1');rich(h,block.slice(2));el.append(k,h)}else if(block.startsWith('## ')){el=d.createElement('h2');el.className='chronBattle';rich(el,block.slice(3))}else if(block.startsWith('### ')){el=d.createElement('h3');el.className='chronSub';rich(el,block.slice(4))}else{el=d.createElement('p');rich(el,block.replace(/\n/g,' '))}article.appendChild(el)});article.classList.add('canonicalChronicle');const st=d.createElement('style');st.textContent='#chronicle .canonicalChronicle{max-width:860px}.chronLead{text-align:center;padding:10px 0 36px;margin-bottom:42px;border-bottom:4px double #9b702b}.chronLead>div{font:900 12px Arial;letter-spacing:.16em;text-transform:uppercase;color:#5a120f}.chronLead h1{font-size:clamp(38px,6vw,60px);line-height:1.02;margin:12px 0 0}.chronBattle{font-size:clamp(29px,4vw,39px);line-height:1.1;margin:56px 0 5px;padding:28px 28px 0;border-top:5px solid #5a120f;background:#fffdf7}.chronSub{font:italic 700 clamp(21px,3vw,27px) Georgia;color:#8a6327;margin:0;padding:8px 28px 24px;background:#fffdf7;border-bottom:1px solid #d2c3a8}.canonicalChronicle p{font-size:22px;line-height:1.72;margin:0 0 20px}.canonicalChronicle strong{color:#5a120f}@media(max-width:760px){.chronBattle,.chronSub{margin-left:-20px;margin-right:-20px;padding-left:20px;padding-right:20px}.canonicalChronicle p{font-size:21px;line-height:1.68}}';d.head.appendChild(st)}}const badge=d.createElement('div');badge.textContent='CHRONICLE BUILD CANONICAL';badge.style.cssText='position:fixed;right:8px;bottom:8px;z-index:99999;background:#5a120f;color:#fff;padding:5px 8px;font:700 10px Arial;letter-spacing:.05em;opacity:.72;pointer-events:none';d.body.appendChild(badge)}catch(e){console.error(e)}if(location.hash){try{const b=d.querySelector('[data-tab="'+location.hash.slice(1)+'"]');if(b)b.click()}catch(e){}}};</script></body></html>
