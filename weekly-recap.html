<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>League of Olympus Chronicle</title><style>html,body,#chronicle{margin:0;width:100%;height:100%;border:0;background:#fffef9}body{overflow:hidden}</style></head><body><iframe id="chronicle" title="League of Olympus Chronicle"></iframe><script>const f=document.getElementById('chronicle');const p=new URLSearchParams(location.search);f.src='./weekly-recap-base.html?'+p.toString()+(location.hash||'');f.onload=async()=>{const d=f.contentDocument;if(!d)return;try{const week=Number(p.get('week')||1);for(const src of ['./chronicle-week-snapshots.js?v=486c695','./chronicle-enhancements.js?v=d21542a','./chronicle-mainboard-ledger.js?v=b62f74c','./chronicle-static-map.js?v=89a9feb7']){const r=await fetch(src,{cache:'no-store'});if(!r.ok)throw new Error(src+' '+r.status);const s=d.createElement('script');s.textContent=await r.text();d.body.appendChild(s)}const article=d.querySelector('#chronicle article.chron');if(article){const r=await fetch('./chronicles/week-'+String(week).padStart(2,'0')+'.md',{cache:'no-store'});if(r.ok){const md=await r.text();article.innerHTML='';const rich=(el,text)=>text.split(/(\*\*.*?\*\*)/g).filter(Boolean).forEach(part=>{if(part.startsWith('**')&&part.endsWith('**')){const b=d.createElement('strong');b.textContent=part.slice(2,-2);el.appendChild(b)}else el.appendChild(d.createTextNode(part))});const lines=md.replace(/\r/g,'').split('\n');for(let i=0;i<lines.length;){if(!lines[i].trim()){i++;continue}const line=lines[i].trim();let el;if(line.startsWith('# ')){el=d.createElement('header');el.className='chronLead';const h=d.createElement('h1');rich(h,line.slice(2));el.appendChild(h);i++}else if(line.startsWith('## ')){el=d.createElement('section');el.className='chronBattleCard';const h=d.createElement('h2');rich(h,line.slice(3));el.appendChild(h);i++;if(i<lines.length&&lines[i].trim().startsWith('### ')){const h3=d.createElement('h3');rich(h3,lines[i].trim().slice(4));el.appendChild(h3);i++}}else{el=d.createElement('p');rich(el,line);i++}article.appendChild(el)}}}}catch(e){console.error(e)}if(location.hash){try{d.querySelector('[data-tab="'+location.hash.slice(1)+'"]')?.click()}catch(e){}}};</script></body></html>
