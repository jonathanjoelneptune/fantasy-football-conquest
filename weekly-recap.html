<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>League of Olympus Chronicle</title><style>html,body,#chronicle{margin:0;width:100%;height:100%;border:0;background:#fffef9}body{overflow:hidden}</style></head><body><iframe id="chronicle" title="League of Olympus Chronicle"></iframe><script>const f=document.getElementById('chronicle');const p=new URLSearchParams(location.search);f.src='./weekly-recap-base.html?'+p.toString()+(location.hash||'');f.onload=async()=>{const d=f.contentDocument;if(!d)return;try{const week=Number(p.get('week')||1);const st=d.createElement('style');st.textContent='#changed .change{position:relative;background:linear-gradient(135deg,#fffdf8,#fff 72%);border:1px solid #dfd3bf!important;border-left:6px solid var(--winner,#9b702b)!important;border-radius:3px;padding:15px 16px 16px!important;box-shadow:0 4px 12px #2a180f24,0 1px 2px #2a180f20!important;color:#241811!important;text-shadow:0 1px 0 #fff}#changed .change b{display:block;color:var(--winner,#5a120f)!important;font-size:20px!important;line-height:1.15;margin-bottom:6px;text-shadow:0 1px 0 #fff,0 1px 2px #00000018}.reportWinner{color:var(--winner,#5a120f)!important;font-weight:900}.reportLoser{color:var(--loser,#5a120f)!important;font-weight:800}#canonicalLedger .territoryCard{position:relative;border:1px solid #c9bda9!important;border-top:6px solid var(--team-accent,#9b702b)!important;box-shadow:inset 6px 0 0 var(--team-accent,#9b702b),0 5px 14px #2a180f2b,0 1px 3px #2a180f24!important;padding:22px 22px 24px;background:linear-gradient(135deg,#fffdf8,#fff 70%);text-shadow:0 1px 0 #fff}#canonicalLedger .territoryCard .count{color:var(--team-accent,#5a120f)!important;font-size:13px;font-weight:900;text-shadow:0 1px 0 #fff}#canonicalLedger .territoryCard h3{color:var(--team-accent,#5a120f)!important;font-size:25px;margin:5px 0 15px;text-shadow:0 1px 0 #fff,0 1px 2px #00000018}#canonicalLedger .territoryNames{display:flex;flex-wrap:wrap;gap:9px 10px}#canonicalLedger .territoryNames span{display:inline-block;padding:8px 11px;border:1px solid #cfc1aa;border-left:3px solid var(--team-accent,#9b702b);background:#fffaf0;font:700 18px/1.2 Georgia,serif;color:#21170f;box-shadow:0 2px 5px #2a180f1f;text-shadow:0 1px 0 #fff}@media(max-width:760px){#changed .change{padding:13px 14px 14px!important;box-shadow:0 3px 9px #2a180f2b!important}#changed .change b{font-size:18px!important}#canonicalLedger .territoryCard{padding:18px;box-shadow:inset 5px 0 0 var(--team-accent,#9b702b),0 4px 11px #2a180f30!important}#canonicalLedger .territoryNames span{font-size:17px;padding:7px 9px;box-shadow:0 2px 4px #2a180f24}}';d.head.appendChild(st);for(const src of ['./chronicle-week-snapshots.js?v=76c7fd7','./chronicle-enhancements.js?v=d21542a','./chronicle-mainboard-ledger.js?v=862dc10','./chronicle-static-map.js?v=89a9feb7']){const r=await fetch(src,{cache:'no-store'});if(!r.ok)throw new Error(src+' '+r.status);const s=d.createElement('script');s.textContent=await r.text();d.body.appendChild(s)}const article=d.querySelector('#chronicle article.chron');if(article){const r=await fetch('./chronicles/week-'+String(week).padStart(2,'0')+'.md',{cache:'no-store'});if(r.ok){const md=await r.text();article.innerHTML='';const rich=(el,text)=>text.split(/(\*\*.*?\*\*)/g).filter(Boolean).forEach(part=>{if(part.startsWith('**')&&part.endsWith('**')){const b=d.createElement('strong');b.textContent=part.slice(2,-2);el.appendChild(b)}else el.appendChild(d.createTextNode(part))});for(const line0 of md.replace(/\r/g,'').split('\n')){const line=line0.trim();if(!line)continue;let el;if(line.startsWith('# ')){el=d.createElement('header');el.className='chronLead';const h=d.createElement('h1');rich(h,line.slice(2));el.appendChild(h)}else if(line.startsWith('## ')){el=d.createElement('section');el.className='chronBattleCard';const h=d.createElement('h2');rich(h,line.slice(3));el.appendChild(h)}else if(line.startsWith('### ')){el=d.createElement('h3');rich(el,line.slice(4))}else{el=d.createElement('p');rich(el,line)}article.appendChild(el)}}}}catch(e){console.error(e)}if(location.hash){try{d.querySelector('[data-tab="'+location.hash.slice(1)+'"]')?.click()}catch(e){}}};</script></body></html>
