<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>League of Olympus Chronicle</title><style>html,body,#chronicle{margin:0;width:100%;height:100%;border:0;background:#fffef9}body{overflow:hidden}</style></head><body><iframe id="chronicle" title="League of Olympus Chronicle"></iframe><script>const f=document.getElementById('chronicle');const p=new URLSearchParams(location.search);f.src='./weekly-recap-base.html?'+p.toString()+(location.hash||'');f.onload=async()=>{const d=f.contentDocument;if(!d)return;try{const early=d.createElement('style');early.textContent='#conquest .battlehead{display:none!important}';early.id='conquestEarlyHide';d.head.appendChild(early);const week=Number(p.get('week')||1);const chronMap=d.querySelector('#chronicle .fadeMap');if(chronMap){chronMap.innerHTML=`<img class="cs a" src="./chronicle-snapshots/original.jpg" alt="League map before Week ${week}"><img class="cs b" src="./chronicle-snapshots/week-${String(week).padStart(2,'0')}.jpg" alt="League map after Week ${week}"><div class="stateBadge sb">Before Week ${week}</div>`;}for(const src of ['./chronicle-enhancements.js?v=e72e91a','./chronicle-ledger-week1.js?v=6525502','./chronicle-static-map.js?v=89a9feb7']){const r=await fetch(src,{cache:'no-store'});if(!r.ok)throw new Error(src+' '+r.status);const s=d.createElement('script');s.textContent=await r.text();d.body.appendChild(s)}const article=d.querySelector('#chronicle article.chron');if(article){const r=await fetch('./chronicles/week-'+String(week).padStart(2,'0')+'.md',{cache:'no-store'});if(r.ok){const md=await r.text();article.replaceChildren();const rich=(el,text)=>text.split(/(\*\*.*?\*\*)/g).filter(Boolean).forEach(part=>{if(part.startsWith('**')&&part.endsWith('**')){const b=d.createElement('strong');b.textContent=part.slice(2,-2);el.appendChild(b)}else el.appendChild(d.createTextNode(part))});const lines=md.replace(/\r/g,'').split('\n');for(let i=0;i<lines.length;){if(!lines[i].trim()){i++;continue}let line=lines[i].trim(),el;if(line.startsWith('# ')){el=d.createElement('header');el.className='chronLead';const k=d.createElement('div');k.textContent='Chronicles of the Conquest • Week '+week;const h=d.createElement('h1');rich(h,line.slice(2));el.append(k,h);i++}else if(line.startsWith('## ')){el=d.createElement('section');el.className='chronBattleCard';const h=d.createElement('h2');rich(h,line.slice(3));el.appendChild(h);i++;if(i<lines.length&&lines[i].trim().startsWith('### ')){const sub=d.createElement('h3');rich(sub,lines[i].trim().slice(4));el.appendChild(sub);i++}while(i<lines.length&&!lines[i].trim())i++;if(i<lines.length&&/^\*\*.*\*\*$/.test(lines[i].trim())){const score=d.createElement('div');score.className='chronScore';rich(score,lines[i].trim());el.appendChild(score);i++}}else{let parts=[];while(i<lines.length&&lines[i].trim()&&!lines[i].trim().startsWith('#')){parts.push(lines[i].trim());i++}el=d.createElement('p');rich(el,parts.join(' '))}article.appendChild(el)}article.classList.add('canonicalChronicle');const st=d.createElement('style');st.textContent='#chronicle .canonicalChronicle{max-width:860px}.chronLead{text-align:center;padding:10px 0 36px;margin-bottom:38px;border-bottom:4px double #9b702b}.chronLead>div{font:900 12px Arial;letter-spacing:.16em;text-transform:uppercase;color:#5a120f}.chronLead h1{font-size:clamp(38px,6vw,60px);line-height:1.02;margin:12px 0 0}.chronBattleCard{margin:52px 0 26px;padding:24px 26px 20px;border-top:5px solid #5a120f;border-bottom:1px solid #d2c3a8;background:#fffdf7}.chronBattleCard h2{display:block;margin:0 0 8px!important;padding:0!important;border:0!important;background:none!important;font:700 clamp(25px,3.5vw,34px)/1.12 Georgia,serif!important;color:#17110d!important;letter-spacing:-.015em!important;text-transform:none!important}.chronBattleCard h3{display:block;margin:0 0 14px!important;padding:0!important;border:0!important;background:none!important;font:italic 700 clamp(20px,2.7vw,26px)/1.2 Georgia,serif!important;color:#8a6327!important}.chronScore{display:block;padding-top:13px;border-top:1px solid #dfd2bc;font:900 16px/1.4 Arial,sans-serif;color:#5a120f}.chronScore strong{color:#5a120f}.canonicalChronicle p{font-size:22px;line-height:1.72;margin:0 0 20px}.canonicalChronicle strong{color:#5a120f}@media(max-width:760px){.chronBattleCard{margin:42px -20px 24px;padding:20px}.chronBattleCard h2{font-size:27px!important;line-height:1.12!important}.chronBattleCard h3{font-size:21px!important;margin-top:5px!important}.chronScore{font-size:15px}.canonicalChronicle p{font-size:21px;line-height:1.68}}';d.head.appendChild(st)}}}catch(e){console.error(e)}if(location.hash){try{const b=d.querySelector('[data-tab="'+location.hash.slice(1)+'"]');if(b)b.click()}catch(e){}}};</script></body></html>
