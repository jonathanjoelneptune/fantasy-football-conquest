<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>League of Olympus Chronicle</title><style>html,body,#chronicle{margin:0;width:100%;height:100%;border:0;background:#fffef9}body{overflow:hidden}</style></head><body><iframe id="chronicle" title="League of Olympus Chronicle"></iframe><script>const f=document.getElementById('chronicle');const p=new URLSearchParams(location.search);p.set('shell','f0f3ac3');f.src='./weekly-recap.html?'+p.toString()+(location.hash||'');f.onload=()=>{const d=f.contentDocument;if(!d)return;if(location.hash){try{const inner=d.getElementById('chronicle');const id=location.hash.slice(1);const click=()=>{try{const b=inner?.contentDocument?.querySelector('[data-tab="'+id+'"]');if(b)b.click()}catch(e){}};click();inner?.addEventListener('load',click,{once:true})}catch(e){}}};</script></body></html>
