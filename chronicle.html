<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>League of Olympus Chronicle</title><style>html,body,#chronicle{margin:0;width:100%;height:100%;border:0;background:#fffef9}body{overflow:hidden}</style></head><body><iframe id="chronicle" title="League of Olympus Chronicle"></iframe><script>const f=document.getElementById('chronicle');const p=new URLSearchParams(location.search);p.set('shell','stable-e8af620-sleeper-legends-2');f.src='./weekly-recap.html?'+p.toString()+(location.hash||'');f.onload=()=>{const d=f.contentDocument;if(!d)return;const inner=d.getElementById('chronicle');const injectOwner=async()=>{try{const idoc=inner?.contentDocument;if(!idoc||idoc.getElementById('chronicleSleeperOwnerResolver'))return;const r=await fetch('./chronicle-sleeper-owners.js?v=0d17b1d',{cache:'no-store'});if(!r.ok)return;const s=idoc.createElement('script');s.id='chronicleSleeperOwnerResolver';s.textContent=await r.text();idoc.body.appendChild(s)}catch(e){console.error('Sleeper Living Legends ownership resolver',e)}};const applyHash=()=>{try{const id=location.hash.slice(1);if(id){const b=inner?.contentDocument?.querySelector('[data-tab="'+id+'"]');if(b)b.click()}if(id==='legends')injectOwner()}catch(e){}};const wire=()=>{applyHash();try{const idoc=inner?.contentDocument;idoc?.querySelector('.tab[data-tab="legends"]')?.addEventListener('click',injectOwner,{once:true})}catch(e){}};wire();inner?.addEventListener('load',wire,{once:true})};</script></body></html>
