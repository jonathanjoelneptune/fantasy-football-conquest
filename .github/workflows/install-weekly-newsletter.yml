name: Install Weekly Newsletter Tab
on:
  workflow_dispatch:
  push:
    paths:
      - weekly-newsletter-inline.js
      - newsletter-integrate.py
      - .github/workflows/install-weekly-newsletter.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Big Board
        run: python newsletter-integrate.py
      - name: Commit installed newsletter
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate Weekly Newsletter into Season Center [skip ci]"
          git push
