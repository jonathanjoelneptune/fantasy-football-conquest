name: Install Weekly Newsletter Tab
on:
  workflow_dispatch:
  push:
    paths:
      - weekly-newsletter.js
      - .github/workflows/install-weekly-newsletter.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Big Board
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old='''<button class="screenTab active" data-season-hub-tab="bigboard" type="button">Matchups</button>
                  <button class="screenTab" data-season-hub-tab="week" type="button">Weekly Honors</button>'''
          new='''<button class="screenTab active" data-season-hub-tab="bigboard" type="button">Matchups</button>
                  <button class="screenTab" data-season-hub-tab="newsletter" type="button">Weekly Newsletter</button>
                  <button class="screenTab" data-season-hub-tab="week" type="button">Weekly Honors</button>'''
          if 'data-season-hub-tab="newsletter"' not in s:
              if old not in s:
                  raise SystemExit("Season tab anchor not found")
              s=s.replace(old,new,1)
          import re
          tag='<script src="./weekly-newsletter.js?v=3"></script>'
          s=re.sub(r'<script src="\\./weekly-newsletter\\.js\\?v=[^"]+"></script>',tag,s)
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding="utf-8")
      - name: Commit installed tab
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Install Weekly Newsletter tab [skip ci]"
          git push
