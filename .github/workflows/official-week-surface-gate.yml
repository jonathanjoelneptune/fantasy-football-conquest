name: Official Week Surface Gate

on:
  push:
    branches:
      - "fix/official-week-finalization"
    paths:
      - ".github/workflows/official-week-surface-gate.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/official-week-finalization"
          fetch-depth: 0
      - name: Apply finalization gate to matchup surfaces
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='  // Final v8.16 public release identity.\n'
          if marker not in s:
              raise SystemExit('release marker not found')
          payload=''
          patch=base64.b64decode(payload).decode('utf-8')
          if 'Make every matchup surface consume the same official-week gate.' not in s:
              s=s.replace(marker,patch+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        shell: bash
        run: rm .github/workflows/official-week-surface-gate.yml
      - name: Commit matchup surface gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use official week gate for matchup final states"
          git push origin HEAD:fix/official-week-finalization
