name: Official Week Finalization Hotfix

"on":
  push:
    branches:
      - "fix/official-week-finalization"
    paths:
      - ".github/workflows/official-week-finalization-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/official-week-finalization"
          fetch-depth: 0
      - name: Gate official weekly results until Monday slate is final
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='  // Final v8.16 public release identity.\n'
          if marker not in s:
              raise SystemExit('release marker not found')
          payload=''
          patch=base64.b64decode(payload).decode('utf-8')
          if 'v8.19 — official fantasy-week finalization gate' not in s:
              s=s.replace(marker,patch+marker,1)
          s=s.replace("p.siteVersion='8.18'","p.siteVersion='8.19'")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        shell: bash
        run: rm .github/workflows/official-week-finalization-hotfix.yml
      - name: Commit finalization gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Gate official weekly results until Monday NFL slate is final"
          git push origin HEAD:fix/official-week-finalization
