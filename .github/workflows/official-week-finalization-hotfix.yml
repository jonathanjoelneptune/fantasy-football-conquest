name: Official Week Finalization Hotfix

"on":
  push:
    branches:
      - "fix/official-week-finalization"
    paths:
      - ".github/workflows/official-week-finalization-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/official-week-finalization"
          fetch-depth: 0
      - name: Gate official weekly results until Monday slate is final
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = "  // Final v8.16 public release identity.\n"
          if marker not in s:
              raise SystemExit("release marker not found")

          patch = r'''  // v8.19 — official fantasy-week finalization gate --------------------------
  // Live scores, projections, player states, and battle fronts may update all
  // weekend. Official league state does not settle until the last Monday NFL
  // game is FINAL. Until then: no W/L, PF/PA standings movement, All-Play,
  // conquest ownership/soldier advancement, or other completed-week analytics.
  function officialFantasyWeekFinalV819(week){
    const w=Math.max(1,Number(week||1));
    const current=Math.max(1,Number(sleeperData?.state?.week||resolvedCurrentSleeperWeek?.()||currentWeek||1));
    const seasonType=String(sleeperData?.state?.season_type||'regular').toLowerCase();
    if(seasonType==='post'||String(sleeperData?.league?.status||'').toLowerCase()==='complete')return true;
    if(w<current)return true;
    if(w>current)return false;

    // Fail closed for the active week. We only settle it early when it is
    // Monday in the NFL's Eastern-time operating day and the live ESPN slate
    // confirms every Monday game for this NFL week is post/final.
    let weekday='';
    try{weekday=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short'}).format(new Date());}catch(_){weekday=new Date().getDay()===1?'Mon':'';}
    if(weekday!=='Mon'||nflWatchStateV794?.source!=='live')return false;
    const rows=(nflWatchStateV794?.events||[]).filter(e=>!Number(e?.week||0)||Number(e.week)===w);
    if(!rows.length)return false;
    return rows.every(e=>String(e?.state||'').toLowerCase()==='post');
  }

  // The imported Sleeper season is the source used by conquest history and
  // permanent map state. Keep the active week provisional until the gate opens.
  const sleeperBuildImportedWeekV819Base=sleeperBuildImportedWeek;
  sleeperBuildImportedWeek=function(week,rows){
    const games=sleeperBuildImportedWeekV819Base.apply(this,arguments),settled=officialFantasyWeekFinalV819(week);
    return games.map(m=>{
      if(settled){
        const sa=Number(m.sa||0),sb=Number(m.sb||0),winner=sa===sb?null:(sa>sb?m.a:m.b);
        return {...m,final:true,winner,loser:winner?(winner===m.a?m.b:m.a):null};
      }
      return {...m,final:false,winner:null,loser:null};
    });
  };

  // hubSeasonSource previously called the current week final as soon as either
  // fantasy team had points. Normalize that output to the same authoritative
  // week gate so standings/All-Play/awards cannot consume a partial week.
  const hubSeasonSourceV819Base=hubSeasonSource;
  hubSeasonSource=function(seasonId=activeSeasonId){
    const src=hubSeasonSourceV819Base.apply(this,arguments),rec=src?.rec;
    if(rec?.provider==='sleeper'&&seasonId===activeSeasonId&&sleeperData?.connected&&src?.season?.reg){
      const current=Math.max(1,Number(sleeperData?.state?.week||resolvedCurrentSleeperWeek?.()||currentWeek||1));
      const games=src.season.reg[current]||[],settled=officialFantasyWeekFinalV819(current);
      src.season.reg[current]=games.map(m=>{
        if(settled){
          const sa=Number(m.sa||0),sb=Number(m.sb||0),winner=sa===sb?null:(sa>sb?m.a:m.b);
          return {...m,final:true,winner,loser:winner?(winner===m.a?m.b:m.a):null};
        }
        return {...m,final:false,winner:null,loser:null};
      });
    }
    return src;
  };

  // standingsFrom historically counted PF/PA for every supplied matchup even
  // when it was unfinished. Filter explicitly-provisional games before the
  // legacy standings engine sees them. Undefined final remains compatible with
  // older historical/scripted seasons; only final:false is excluded.
  const standingsFromV819Base=standingsFrom;
  standingsFrom=function(regWeeks,throughWeek=14){
    const gated=[];
    for(let w=0;w<=Math.max(17,Number(throughWeek||0));w++){
      const rows=regWeeks?.[w];
      gated[w]=Array.isArray(rows)?rows.filter(m=>m?.final!==false):rows;
    }
    return standingsFromV819Base.call(this,gated,throughWeek);
  };

'''

          if "v8.19 — official fantasy-week finalization gate" not in s:
              s = s.replace(marker, patch + marker, 1)
          s = s.replace("p.siteVersion='8.18'", "p.siteVersion='8.19'")
          p.write_text(s, encoding="utf-8")
          PY
      - name: Remove one-shot workflow
        shell: bash
        run: rm .github/workflows/official-week-finalization-hotfix.yml
      - name: Commit finalization gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Gate official weekly results until Monday NFL slate is final"
          git push origin HEAD:fix/official-week-finalization
